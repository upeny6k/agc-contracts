<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>AGC Contract Management</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f4f7fb; --card:#fff; --card2:#f8fafc; --line:#e2e8f0;
    --txt:#111c2e; --muted:#64748b; --accent:#2563eb;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.45;padding-bottom:24px}
  .wrap{max-width:680px;margin:0 auto;padding:0 12px}

  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px}
  .hrow{display:flex;align-items:center;gap:10px;max-width:680px;margin:0 auto}
  .back{border:none;background:var(--card2);color:var(--txt);font-size:16px;
    width:32px;height:32px;border-radius:9px;cursor:pointer;line-height:1;flex:0 0 auto}
  .htitle{font-size:16px;font-weight:700;line-height:1.2}
  .hsub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
    background:rgba(22,163,74,.12);color:var(--ok);border:1px solid rgba(22,163,74,.25);
    white-space:nowrap;margin-left:auto}
  .pill.wait{background:rgba(100,116,139,.12);color:var(--muted);border-color:rgba(100,116,139,.25)}

  /* grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  @media(max-width:380px){.grid{grid-template-columns:1fr}}
  .cc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
  .cc:active{transform:scale(.985)}
  .cc .code{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--accent)}
  .cc .nm{font-size:13px;font-weight:650;line-height:1.3}
  .cc .fm{font-size:11.5px;color:var(--muted);line-height:1.3}
  .cc .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--muted);padding-top:6px}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--ok);display:inline-block;margin-right:4px}
  .dot.off{background:#cbd5e1}

  /* tabs */
  nav.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;
    border-bottom:1px solid var(--line);scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 11px;font-size:12.5px;color:var(--muted);background:none;
    border:none;border-bottom:2px solid transparent;cursor:pointer;font-weight:600}
  .tab.on{color:var(--txt);border-bottom-color:var(--accent)}

  section{display:none;padding-top:14px}
  section.on{display:block}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px}
  .card h3{margin:0 0 10px;font-size:11.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;font-weight:700}

  .kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
    border-bottom:1px dashed rgba(15,23,42,.07)}
  .kv:last-child{border-bottom:none}
  .kv .l{color:var(--muted);font-size:12.5px;flex:0 0 auto}
  .kv .v{text-align:right;font-size:13px;font-weight:600;word-break:break-word}
  .mono{font-variant-numeric:tabular-nums}

  .bignum{display:flex;gap:10px;margin-bottom:10px}
  .bn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .bn .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .bn .v{font-size:17px;font-weight:750;margin-top:3px}
  .bn .s{font-size:11px;color:var(--muted);margin-top:2px}

  .bar{height:8px;background:#e8eef7;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 6px;text-align:right;border-bottom:1px solid #eef2f7}
  th:first-child,td:first-child{text-align:left}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  tbody tr:last-child td{border-bottom:none}
  .tot td{font-weight:800;border-top:2px solid var(--line);background:#fbfdff}

  .seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:var(--card);color:var(--muted);
    font-size:12px;padding:6px 10px;border-radius:99px;cursor:pointer;font-weight:600}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:12.5px;
    border:1px dashed var(--line);border-radius:var(--radius);background:rgba(15,23,42,.02)}
  .empty .ico{font-size:24px;display:block;margin-bottom:8px;opacity:.65}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .field label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field select{padding:10px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff;color:var(--txt);font-family:inherit;width:100%}
  .btn{display:block;width:100%;padding:12px;border-radius:11px;border:none;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .note{font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:10px;margin-top:10px;line-height:1.5}
  .badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;
    padding:2px 6px;border-radius:5px;background:rgba(217,119,6,.12);color:var(--warn);margin-left:6px}
  .sev-high{color:var(--bad);font-weight:700}
  .sev-med{color:var(--warn);font-weight:700}

  @media print{
    body{background:#fff}
    header,nav.tabs,.no-print{display:none!important}
    section{display:none!important}
    section.on{display:block!important;padding:0}
    .card{border:none;padding:0;margin:0}
    table{font-size:11px}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="back" id="backBtn" style="display:none">‹</button>
    <div>
      <div class="htitle" id="hTitle">AGC Contract Management</div>
      <div class="hsub" id="hSub">Coaching Depot Agra Cantt · NCR</div>
    </div>
    <div class="pill" id="hPill">11 ACTIVE</div>
  </div>
</header>

<div class="wrap" id="view"></div>

<script>
const DATA = {
  "MCC-AMAR": {
    code:"MCC-AMAR",
    name:"Coach Cleaning & Watering",
    firm:"AMAR INDIA PRIVATE LIMITED, Bhopal",
    status:"active", onboarded:true,
    overview:{
      contract_no:"GEMC-511687795368509",
      agreement_no:"GEMC-511687795368509",
      agreement_date:"11.06.2024",
      awarded_to:"AMAR INDIA PRIVATE LIMITED, Bhopal",
      start:"04.07.2024",
      finish:"03.07.2028",
      amount:40417598.66,
      qty_remaining_pct:93.52,
      consumed:2619262.47,
      rate_per_month:873087.49,
      projected_finish:"Jul-2028",
      last_bill_period:"Dec-2024",
      last_bill_amount:750330.95
    },
    bills:{
      sample:true,
      months:[
        {m:"Oct-24", amt:980188.68, pa:3600, pb:10700, tot:14300},
        {m:"Nov-24", amt:888742.84, pa:25430, pb:700, tot:26130},
        {m:"Dec-24", amt:750330.95, pa:21115, pb:12060, tot:33175}
      ],
      penalty_abc:73605, inspection:18000, railmadad:24000, total_penalty:115605
    },
    scores:{
      sample:true,
      sheets:[
        {type:"SA-1", label:"Primary", date:"01.04.2026", train:"11902", sup:"Mohit Kumar", coaches:11, pct:83.33, ext:66.67, pen:0},
        {type:"SA-2", label:"Intensive", date:"10.05.2026", train:"11905", sup:"Upendra Singh", coaches:2, pct:86.67, ext:0, pen:null},
        {type:"SA-3", label:"Turnaround", date:"22.05.2026", train:"11902/01", sup:"Dileep Kumar", coaches:12, pct:56.67, ext:null, pen:750}
      ]
    }
  }
};

const OTHERS = [
  ["BIO-AMAR","Bio Toilet AMOC","Amar India Pvt Ltd"],
  ["SICK-TRUCK","Sickline Truck Transport","Sudhir Kumar Chaudhary"],
  ["OBHS-SUN","OBHS & Linen Distribution","Sun Facility Services"],
  ["LIN-ABCO","Mechanized Linen Washing","ABCO Services"],
  ["WRP-VAP","Water Recycling Plant O&M","Vishwakarma Aakriti Projects"],
  ["PEST-CWC","Pest & Rodent Control","Central Warehousing Corp"],
  ["FIRE-BFS","Fire Extinguisher Refilling","Bundelkhand Fire Service"],
  ["MUV-YATI","MUV Hiring 2000 km","Yati Enterprises"],
  ["WATER-KLL","Enroute Coach Watering","Khagaul Loco Labour"],
  ["DEP-KSE","Depot Cleaning & Housekeeping","KS Enterprises"],
  ["VB-OBHS","VB MCC & OBHS Service","Bhupendra Singh"],
  ["WSET-SKC","Sickline Wheel Set Transport","Sudhir Kumar Chaudhary"],
  ["SUV-MAYA","SUV Cab Hiring 24x7","Maya Enterprises"],
  ["VB-UNDER","VB Underslung Equipment Maint","Vivil Electricals"],
  ["FSDS-FET","Fire & Smoke Detection AMC","Fire Engineering Technology"],
  ["UG-SBS","Upper Gear Amenities Maint","SBS Enterprises"],
  ["TRK-UPT","9 Ton Truck Hiring","UP Traders"],
  ["QWS-RAJ","Quick Watering System CAMC","Raj Construction & Developers"],
  ["NOSE-SRE","FRP Nose Cone Repair","SR Electricals"],
  ["EOT-DEV","EOT Crane CAMC","Devraj"],
  ["CNC-HYT","CNC Wheel Lathe CAMC","HYT Engineering"],
  ["VAC-AMIT","Vacuum Evacuation CAMC","Amit Engineers"],
  ["IGBT-MED","IGBT Propulsion CAMC","Medha Drives"],
  ["SUV-LITT","Premium SUV DRM Office","Littgo Industries"],
  ["RMPU-SID","RMPU & Cab AC AMC","Sidwal Refrigeration"],
  ["GLASS-CML","Glass Replacement VB","CML Euro Inc"],
  ["HABD-IQN","Hot Axle Box Detection AMC","IQNET Systems"]
].map(([code,name,firm])=>({code,name,firm,status:"pending",onboarded:false}));

const ALL = [DATA["MCC-AMAR"], ...OTHERS];
const $ = s => document.querySelector(s);
const inr = n => "₹" + Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const inr2 = n => "₹" + Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});

let view = {route:"grid", code:null, tab:"overview", scoreBy:"sheet", billFrom:"2024-10-01", billTo:"2024-12-31"};

/* ---------- GRID ---------- */
function renderGrid(){
  $("#backBtn").style.display="none";
  $("#hTitle").textContent="AGC Contract Management";
  $("#hSub").textContent="Coaching Depot Agra Cantt · NCR";
  $("#hPill").textContent = ALL.filter(c=>c.onboarded).length + " ONBOARDED";
  const cards = ALL.map(c=>`
    <div class="cc" data-code="${c.code}">
      <div class="code">${c.code}</div>
      <div class="nm">${c.name}</div>
      <div class="fm">${c.firm}</div>
      <div class="ft">
        <span><span class="dot ${c.onboarded?"":"off"}"></span>${c.onboarded?"active":"pending"}</span>
        <span>${c.onboarded?"›":"—"}</span>
      </div>
    </div>`).join("");
  $("#view").innerHTML = `<div class="grid">${cards}</div>
    <div class="note">Jo contracts onboard ho gaye hain unka card khulta hai. Baaki ke liye documents Telegram topic me bhejne hain.</div>`;
  document.querySelectorAll(".cc").forEach(el=>{
    el.onclick = ()=>{ const c = ALL.find(x=>x.code===el.dataset.code);
      if(!c.onboarded){ alert(c.name+" — abhi onboard nahi hua.\nTelegram me is contract ka topic banao aur documents bhejo."); return; }
      view.code = c.code; view.route="contract"; view.tab="overview"; render(); };
  });
}

/* ---------- CONTRACT ---------- */
function renderContract(){
  const c = DATA[view.code];
  $("#backBtn").style.display="block";
  $("#hTitle").textContent = c.code;
  $("#hSub").textContent = c.name + " · " + c.firm.split(",")[0];
  $("#hPill").textContent = "ACTIVE";

  const tabs = [["overview","Overview"],["scores","Scores"],["upload","Upload Score"],["bill","Generate Bill"],["signed","Signed Bill"]];
  $("#view").innerHTML = `
    <nav class="tabs">${tabs.map(([k,l])=>
      `<button class="tab ${view.tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}</nav>
    <section id="tab-overview" class="on"></section>
    <section id="tab-scores"></section>
    <section id="tab-upload"></section>
    <section id="tab-bill"></section>
    <section id="tab-signed"></section>`;

  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;renderContract();});
  ["overview","scores","upload","bill","signed"].forEach(k=>{
    const el = document.getElementById("tab-"+k);
    el.classList.toggle("on", view.tab===k);
  });

  renderOverview(c); renderScores(c); renderUpload(c); renderBill(c); renderSigned(c);
}

function renderOverview(c){
  const o = c.overview;
  const usedPct = (o.consumed / o.amount * 100);
  $("#tab-overview").innerHTML = `
    <div class="bignum">
      <div class="bn"><div class="k">Awarded</div><div class="v">${inr(o.amount)}</div><div class="s">${o.agreement_date} se</div></div>
      <div class="bn"><div class="k">Remaining</div><div class="v">${o.qty_remaining_pct}%</div>
        <div class="bar"><i style="width:${100-o.qty_remaining_pct}%"></i></div></div>
    </div>
    <div class="card">
      <h3>Highlights</h3>
      ${kv("Contract no.", o.contract_no)}
      ${kv("Agreement no. &amp; date", o.agreement_no+" · "+o.agreement_date)}
      ${kv("Awarded to", o.awarded_to)}
      ${kv("Work start", o.start)}
      ${kv("Expected finish", o.finish)}
      ${kv("Amount awarded", inr2(o.amount))}
      ${kv("Consumed value", inr2(o.consumed))}
      ${kv("Consumption rate", inr(o.rate_per_month)+" / month")}
      ${kv("Projected completion", o.projected_finish+" <span class='badge'>based on rate</span>")}
      ${kv("Last bill finalized", o.last_bill_period+" · "+inr2(o.last_bill_amount))}
    </div>`;
}

function kv(l,v){return `<div class="kv"><div class="l">${l}</div><div class="v">${v}</div></div>`;}

function renderScores(c){
  const s = c.scores;
  if(!s || !s.sheets.length){
    $("#tab-scores").innerHTML = `<div class="empty"><span class="ico">📋</span>
      Score sheets abhi ingest nahi hue.<br>Telegram topic me image bhejo, <b>score</b> label ke saath.</div>`;
    return;
  }
  const sheets = s.sheets;
  let rows = "";
  if(view.scoreBy==="sheet"){
    rows = sheets.map(x=>`<tr><td>${x.label}<br><span style="color:#94a3b8;font-size:10.5px">${x.type}</span></td>
      <td>${x.train}</td><td>${x.coaches}</td><td>${x.pct}%</td><td>${x.pen==null?"—":inr(x.pen)}</td></tr>`).join("");
    $("#tab-scores").innerHTML = segHtml(["sheet","train","sup"]) + `
      <div class="card"><h3>Sheet-wise ${s.sample?'<span class="badge">SAMPLE</span>':''}</h3>
      <table><thead><tr><th>Type</th><th>Train</th><th>Coaches</th><th>Rating</th><th>Penalty</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  } else {
    const key = view.scoreBy==="train" ? "train" : "sup";
    const g = {};
    sheets.forEach(x=>{ (g[x[key]] = g[x[key]]||[]).push(x); });
    rows = Object.entries(g).map(([k,arr])=>{
      const avg = arr.reduce((a,b)=>a+b.pct,0)/arr.length;
      return `<tr><td>${k}</td><td>${arr.length}</td><td>${arr.reduce((a,b)=>a+b.coaches,0)}</td><td>${avg.toFixed(2)}%</td></tr>`;
    }).join("");
    const title = view.scoreBy==="train" ? "Train-wise" : "Supervisor-wise";
    const head = view.scoreBy==="train" ? "Train" : "Supervisor";
    $("#tab-scores").innerHTML = segHtml(["sheet","train","sup"]) + `
      <div class="card"><h3>${title} ${s.sample?'<span class="badge">SAMPLE</span>':''}</h3>
      <table><thead><tr><th>${head}</th><th>Sheets</th><th>Coaches</th><th>Avg rating</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{view.scoreBy=b.dataset.k;renderScores(c);});
}

function segHtml(opts){
  const lab={sheet:"Sheet-wise",train:"Train-wise",sup:"Supervisor-wise"};
  return `<div class="seg">${opts.map(o=>`<button data-k="${o}" class="${view.scoreBy===o?"on":""}">${lab[o]}</button>`).join("")}</div>`;
}

function renderUpload(c){
  const kinds = [
    ["Primary","SA-1","Washing line · 4 items + exterior + watering"],
    ["Intensive","SA-2","Deep clean · 5 items + exterior"],
    ["Turnaround","SA-3","Platform · 5 items"]
  ];
  const blocks = kinds.map(([label,annex,desc])=>`
    <div class="card">
      <h3>${label} <span style="color:#94a3b8;font-weight:600">· ${annex}</span></h3>
      <div style="font-size:12px;color:var(--muted);margin:-4px 0 10px">${desc}</div>
      <div class="field"><label>Front side</label><input type="file" accept="image/*" disabled></div>
      <div class="field"><label>Back side (penalty)</label><input type="file" accept="image/*" disabled></div>
    </div>`).join("");

  $("#tab-upload").innerHTML = blocks + `
    <div class="note"><b>Abhi upload disabled hai.</b><br>
      App ko backend se jodna baaki hai. Filhaal Telegram topic me image bhejo aur reply karo
      <b>Primary</b> / <b>Intensive</b> / <b>Turnaround</b> — bot khud parse karke yahan dikha dega.</div>`;
}

function renderBill(c){
  const b = c.bills;
  $("#tab-bill").innerHTML = `
    <div class="card"><h3>Generate bill</h3>
      <div class="field"><label>From date</label><input type="date" id="billFrom" value="${view.billFrom}"></div>
      <div class="field"><label>To date</label><input type="date" id="billTo" value="${view.billTo}"></div>
      <button class="btn" id="genBill">Generate bill summary</button>
      <button class="btn ghost" id="printBill" style="margin-top:8px">Print bill summary</button>
      <div class="note">Bill period ke hisaab se monthly figures filter honge. Print se A4 summary nikal jayegi.</div>
    </div>
    <div class="card" id="billOut"></div>`;
  $("#genBill").onclick = ()=>{ view.billFrom=$("#billFrom").value; view.billTo=$("#billTo").value; drawBill(c); };
  $("#printBill").onclick = ()=>window.print();
  drawBill(c);
}

function drawBill(c){
  const b = c.bills;
  const months = b.months;
  const tot = months.reduce((a,m)=>a+m.amt,0);
  const pen = months.reduce((a,m)=>a+m.tot,0);
  const rows = months.map(m=>`<tr><td>${m.m}</td><td>${inr2(m.amt)}</td>
    <td>${inr(m.pa)}</td><td>${inr(m.pb)}</td><td>${inr(m.tot)}</td></tr>`).join("");
  $("#billOut").innerHTML = `
    <h3>Bill summary ${b.sample?'<span class="badge">SAMPLE</span>':''}</h3>
    <table><thead><tr><th>Month</th><th>Bill amount</th><th>Penalty A</th><th>Penalty B</th><th>A+B+C</th></tr></thead>
    <tbody>${rows}<tr class="tot"><td>Total</td><td>${inr2(tot)}</td><td colspan="2"></td><td>${inr(pen)}</td></tr></tbody></table>
    <div style="margin-top:12px">
      ${kv("Inspection penalty", inr(b.inspection))}
      ${kv("RailMadad penalty", inr(b.railmadad))}
      ${kv("Total penalty imposed", inr(b.total_penalty))}
      ${kv("Net payable (bill − penalty)", inr2(tot - b.total_penalty))}
    </div>`;
}

function renderSigned(c){
  $("#tab-signed").innerHTML = `
    <div class="card"><h3>Upload signed bill summary</h3>
      <div class="field"><label>Signed document (PDF / scan)</label><input type="file" accept=".pdf,image/*" disabled></div>
      <div class="note"><b>Abhi upload disabled hai.</b><br>
        Signed copy Telegram topic me bhejo — bot use <b>05_Bills</b> folder me
        archive karega aur record update kar dega.</div>
    </div>`;
}

/* ---------- ROUTER ---------- */
function render(){
  if(view.route==="grid") renderGrid(); else renderContract();
}

$("#backBtn").onclick = ()=>{ view.route="grid"; render(); };

if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  if (tg.colorScheme) tg.colorScheme = "light";
  if (tg.setHeaderColor) tg.setHeaderColor("#ffffff");
  if (tg.setBackgroundColor) tg.setBackgroundColor("#f4f7fb");
}

render();
</script>
</body>
</html>
